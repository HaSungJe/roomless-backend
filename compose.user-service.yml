# user-service — 마이그레이션 + 인스턴스 N대 + 로드밸런서. 단독 실행
#   npm run docker:user-service   (docker compose -f compose.user-service.yml up -d --build)
#   인스턴스 수: .env 의 USER_SERVICE_REPLICAS(기본 2), 실행 중 바꾸기: docker compose -f compose.user-service.yml up -d --scale user-service=4
#
# 설정 원칙 — 개발 · 가상 운영 · 실제 운영이 같은 파일을 쓰고, 달라지는 것은 .env 뿐이다.
#   - 환경 값(NODE_ENV · DATABASE_URL · RABBITMQ_HOST · 비밀값 …)은 .env 를 그대로 쓴다. compose 는 바꾸지 않고,
#     필수값이 비어 있으면 띄우지 않는다. 같은 서버의 postgres · rabbitmq 묶음(가상 운영)인지, RDS · Amazon MQ(실제 운영)인지는
#     .env 의 접속정보로 고른다.
#   - 서버 구성(컨테이너 안 포트 · 바인딩 주소 · TZ)만 아래에 고정한다 — 어느 환경이든 같다.
#   - 쓰지 않는 비밀값(gateway 브로커 비밀번호 · 브로커 관리자 비밀번호)은 빈 값으로 덮어 전달하지 않는다(앱 동작과 무관).
#
# 부하 분산
#   - 큐(명령): 모든 인스턴스가 같은 q.user.cmd 를 소비 → 브로커가 나눠 준다(경쟁 소비)
#   - 내부 HTTP: user-service-lb(nginx)가 인스턴스들에 라운드로빈 — 게이트웨이는 http://user-service-lb:4001 로 부른다
#   - crontab: 모든 인스턴스가 깨어나지만 DB 잠금(JobLockService)으로 회차마다 1대만 실행
#   - DB · 브로커가 아직 준비 중이어도 migrate 는 DB 연결을 최대 1분 기다리고, 앱은 TypeORM 재시도 · RabbitMQ 자동 재연결로 붙는다
#
# 네트워크 — "user-service 는 게이트웨이만 닿는다"
#   roomless-service (internal) : gateway · user-service-lb · user-service 만 있다
#   roomless-broker / roomless-data : 브로커 / DB 로 나가는 길 (외부 RDS · Amazon MQ 도 이 길로 나간다)
name: roomless-user-service

x-logging: &logging
    driver: json-file
    options:
        max-size: '10m'
        max-file: '5'

x-user-service-image: &user-service-image
    image: roomless/user-service
    build:
        context: .
        args:
            APP: user-service
    logging: *logging

services:
    # 마이그레이션 적용 (1회 실행 후 종료) — 인스턴스 수와 무관하게 한 번만 돈다
    migrate:
        <<: *user-service-image
        command: ['node', 'dist/apps/user-service/apps/user-service/src/migrate.js']
        environment:
            DATABASE_URL: '${DATABASE_URL:?.env 에 DATABASE_URL 이 필요합니다}'
            TZ: Asia/Seoul
        networks: [data]
        restart: 'no'

    user-service:
        <<: *user-service-image
        env_file:
            - path: .env
              required: true
        environment:
            # ── 환경 값: .env 그대로 (비어 있으면 띄우지 않는다) ──
            NODE_ENV: '${NODE_ENV:?.env 에 NODE_ENV 가 필요합니다}'
            DATABASE_URL: '${DATABASE_URL:?.env 에 DATABASE_URL 이 필요합니다}'
            RABBITMQ_HOST: '${RABBITMQ_HOST:?.env 에 RABBITMQ_HOST 가 필요합니다}'
            RABBITMQ_USER_SERVICE_PASSWORD: '${RABBITMQ_USER_SERVICE_PASSWORD:?.env 에 RABBITMQ_USER_SERVICE_PASSWORD 가 필요합니다}'
            JWT_SECRET: '${JWT_SECRET:?.env 에 JWT_SECRET 이 필요합니다}'
            TOKEN_CIPHER_KEY: '${TOKEN_CIPHER_KEY:?.env 에 TOKEN_CIPHER_KEY 가 필요합니다}'
            INTERNAL_API_TOKEN: '${INTERNAL_API_TOKEN:?.env 에 INTERNAL_API_TOKEN 이 필요합니다}'
            # ── 서버 구성: 어느 환경이든 같다 ──
            # user-service-lb 의 upstream 포트(docker/nginx/user-service.conf)와 같아야 한다
            USER_SERVICE_PORT: 4001
            # 컨테이너 안에서는 0.0.0.0 — 닿을 수 있는 상대는 roomless-service 의 user-service-lb · gateway 뿐이다
            USER_SERVICE_HOST: 0.0.0.0
            TZ: Asia/Seoul
            # ── 쓰지 않는 비밀값은 전달하지 않는다 ──
            RABBITMQ_GATEWAY_PASSWORD: ''
            RABBITMQ_PASSWORD: ''
        deploy:
            replicas: ${USER_SERVICE_REPLICAS:-2}
        expose:
            - '4001'
        networks: [service, broker, data]
        depends_on:
            migrate:
                condition: service_completed_successfully
        restart: unless-stopped

    # 내부 HTTP 로드밸런서 — 인스턴스를 Docker DNS 로 계속 다시 찾으므로 --scale 로 늘리거나 줄여도 재시작이 필요 없다
    user-service-lb:
        image: nginx:1.28-alpine
        container_name: roomless-user-service-lb
        volumes:
            - ./docker/nginx/user-service.conf:/etc/nginx/conf.d/default.conf:ro
        expose:
            - '4001'
        networks: [service]
        depends_on:
            - user-service
        logging: *logging
        restart: unless-stopped

networks:
    service:
        name: roomless-service
        external: true
    broker:
        name: roomless-broker
        external: true
    data:
        name: roomless-data
        external: true
