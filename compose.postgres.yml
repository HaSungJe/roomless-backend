# PostgreSQL — 가상 운영 환경용 DB. 단독 실행
#   npm run docker:postgres   (docker compose -f compose.postgres.yml up -d --wait)
#
# 설정은 .env 를 그대로 쓴다(compose 가 값을 바꾸지 않는다). 필수값이 비어 있으면 띄우지 않는다.
# 실제 운영 DB(RDS 등)를 쓰면 이 묶음은 띄우지 않고, .env 의 DATABASE_URL 을 그 주소로 둔다 — 앱 쪽 설정은 그대로다.
#
# 네 묶음(postgres · rabbitmq · user-service · gateway)은 각자 따로 띄우고 내린다. 서로는 공용 네트워크로 만난다
# (npm run docker:network). postgres 는 roomless-data 에만 붙고, 호스트 포트는 127.0.0.1 에만 연다.
name: roomless-postgres

x-logging: &logging
    driver: json-file
    options:
        max-size: '10m'
        max-file: '5'

services:
    postgres:
        image: postgres:17-alpine
        container_name: roomless-postgres
        environment:
            POSTGRES_USER: '${POSTGRES_USER:?.env 에 POSTGRES_USER 가 필요합니다}'
            POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?.env 에 POSTGRES_PASSWORD 가 필요합니다}'
            POSTGRES_DB: '${POSTGRES_DB:?.env 에 POSTGRES_DB 가 필요합니다}'
            TZ: Asia/Seoul
        ports:
            - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
        volumes:
            - postgres-data:/var/lib/postgresql/data
        networks: [data]
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
            interval: 5s
            timeout: 3s
            retries: 10
        logging: *logging
        restart: unless-stopped

networks:
    data:
        name: roomless-data
        external: true

volumes:
    postgres-data:
        name: roomless-postgres-data
