# 로컬 실행 — PostgreSQL + RabbitMQ(+계정 초기화) + 마이그레이션 + user-service + gateway
#   npm run docker:up   (docker compose up -d --build)
#   npm run docker:logs (docker compose logs -f gateway user-service)
#   npm run docker:down
#
# 설정은 .env 를 읽는다(없어도 기본값으로 뜬다). 컨테이너끼리의 주소(DATABASE_URL · RABBITMQ_HOST · USER_SERVICE_URL)는 아래에서 덮어쓰고,
# 각 앱이 쓰지 않는 비밀값(다른 앱의 브로커 비밀번호 · 브로커 관리자 비밀번호 · 게이트웨이의 DB 주소)은 빈 값으로 덮어 전달하지 않는다.
#
# 네트워크로 "user-service 는 게이트웨이만 닿는다" 를 보장한다.
#   edge    : gateway (외부 포트를 여는 유일한 앱)
#   service : gateway · user-service — 내부 HTTP. 이 네트워크에 다른 컨테이너는 없다
#   broker  : gateway · user-service · rabbitmq · rabbitmq-init
#   data    : user-service · migrate · postgres — 게이트웨이는 DB 에 닿지 않는다
# postgres · rabbitmq 의 호스트 포트는 로컬 앱 실행(npm run docker:infra)용으로 127.0.0.1 에만 연다.
name: roomless

x-app-env: &app-env
    env_file:
        - path: .env
          required: false

services:
    postgres:
        image: postgres:17-alpine
        container_name: roomless-postgres
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-roomless}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roomless}
            POSTGRES_DB: ${POSTGRES_DB:-roomless}
            TZ: Asia/Seoul
        ports:
            - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
        volumes:
            - postgres-data:/var/lib/postgresql/data
        networks: [data]
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
            interval: 5s
            timeout: 3s
            retries: 10
        restart: unless-stopped

    rabbitmq:
        image: rabbitmq:4-management-alpine
        container_name: roomless-rabbitmq
        # 노드 이름(rabbit@<hostname>)이 바뀌면 볼륨의 데이터를 못 읽으므로 고정한다
        hostname: roomless-rabbitmq
        environment:
            # 관리자 계정 — 관리 화면 · rabbitmq-init 전용. 앱은 쓰지 않는다
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-roomless}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-roomless}
        ports:
            - '127.0.0.1:${RABBITMQ_PORT:-5672}:5672'
            - '127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
        volumes:
            - rabbitmq-data:/var/lib/rabbitmq
        networks: [broker]
        healthcheck:
            test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
            interval: 10s
            timeout: 5s
            retries: 10
        restart: unless-stopped

    # 브로커 계정(gateway · user-service)과 권한을 만든다 (1회 실행 후 종료) — docker/rabbitmq/init.sh
    rabbitmq-init:
        image: curlimages/curl:8.11.1
        container_name: roomless-rabbitmq-init
        entrypoint: ['/bin/sh', '/init.sh']
        volumes:
            - ./docker/rabbitmq/init.sh:/init.sh:ro
        environment:
            RABBITMQ_API: http://rabbitmq:15672/api
            RABBITMQ_ADMIN_USER: ${RABBITMQ_USER:-roomless}
            RABBITMQ_ADMIN_PASSWORD: ${RABBITMQ_PASSWORD:-roomless}
            RABBITMQ_GATEWAY_PASSWORD: ${RABBITMQ_GATEWAY_PASSWORD:-gateway}
            RABBITMQ_USER_SERVICE_PASSWORD: ${RABBITMQ_USER_SERVICE_PASSWORD:-user-service}
        networks: [broker]
        depends_on:
            rabbitmq:
                condition: service_healthy
        restart: 'no'

    # 마이그레이션 적용 (1회 실행 후 종료). user-service 이미지의 TypeORM 마이그레이션 실행기(migrate.js)가 미적용분을 적용한다.
    migrate:
        image: roomless/user-service
        build:
            context: .
            args:
                APP: user-service
        container_name: roomless-migrate
        command: ['node', 'dist/apps/user-service/apps/user-service/src/migrate.js']
        environment:
            DATABASE_URL: postgresql://${POSTGRES_USER:-roomless}:${POSTGRES_PASSWORD:-roomless}@postgres:5432/${POSTGRES_DB:-roomless}?schema=public
        networks: [data]
        depends_on:
            postgres:
                condition: service_healthy
        restart: 'no'

    user-service:
        <<: *app-env
        image: roomless/user-service
        build:
            context: .
            args:
                APP: user-service
        container_name: roomless-user-service
        environment:
            NODE_ENV: ${NODE_ENV:-development}
            USER_SERVICE_PORT: 4001
            # 컨테이너 안에서는 0.0.0.0 — 닿을 수 있는 상대는 service 네트워크의 gateway 뿐이다
            USER_SERVICE_HOST: 0.0.0.0
            DATABASE_URL: postgresql://${POSTGRES_USER:-roomless}:${POSTGRES_PASSWORD:-roomless}@postgres:5432/${POSTGRES_DB:-roomless}?schema=public
            RABBITMQ_HOST: rabbitmq
            RABBITMQ_PORT: 5672
            # 쓰지 않는 비밀값은 전달하지 않는다
            RABBITMQ_GATEWAY_PASSWORD: ''
            RABBITMQ_PASSWORD: ''
            TZ: Asia/Seoul
        expose:
            - '4001'
        networks: [service, broker, data]
        depends_on:
            migrate:
                condition: service_completed_successfully
            rabbitmq-init:
                condition: service_completed_successfully
        restart: unless-stopped

    gateway:
        <<: *app-env
        image: roomless/gateway
        build:
            context: .
            args:
                APP: gateway
        container_name: roomless-gateway
        environment:
            NODE_ENV: ${NODE_ENV:-development}
            GATEWAY_PORT: 3000
            USER_SERVICE_URL: http://user-service:4001
            RABBITMQ_HOST: rabbitmq
            RABBITMQ_PORT: 5672
            # 쓰지 않는 비밀값은 전달하지 않는다 (게이트웨이는 DB 를 쓰지 않는다)
            RABBITMQ_USER_SERVICE_PASSWORD: ''
            RABBITMQ_PASSWORD: ''
            DATABASE_URL: ''
            POSTGRES_PASSWORD: ''
            TZ: Asia/Seoul
        ports:
            - '${GATEWAY_PORT:-3000}:3000'
        networks: [edge, service, broker]
        depends_on:
            user-service:
                condition: service_started
            rabbitmq-init:
                condition: service_completed_successfully
        restart: unless-stopped

networks:
    edge:
    # 게이트웨이 ↔ user-service 내부 HTTP 전용 — 외부로 나가는 길도 없다
    service:
        internal: true
    # broker · data 는 소속 컨테이너끼리만 닿는다. internal 이면 호스트 포트(127.0.0.1)를 열 수 없어 일반 네트워크로 둔다
    broker:
    data:

volumes:
    postgres-data:
    rabbitmq-data:
