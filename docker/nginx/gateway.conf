# 게이트웨이 로드밸런서 (compose.gateway.yml 의 gateway-lb) — 클라이언트가 들어오는 유일한 입구.
# gateway 인스턴스들을 Docker 내장 DNS(127.0.0.11)로 10초마다 다시 찾아 라운드로빈한다(--scale 변경에 재시작 불필요).
# upstream server 의 resolve 는 nginx 1.27.3 이상(오픈소스)에서 쓸 수 있다.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream gateway {
    zone gateway 64k;
    server gateway:3000 resolve;
    keepalive 32;
}

server {
    listen 80;
    client_max_body_size 10m;

    location / {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 게이트웨이는 TRUST_PROXY=1 로 이 헤더의 마지막 주소(= nginx 가 본 실제 클라이언트)를 쓴다
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 큐 경로 응답은 SSE — 이벤트를 모아 두지 말고 바로 흘려보낸다
        proxy_buffering off;
        proxy_cache off;
        # SSE 는 결과를 최대 30초 기다린 뒤 pending 으로 끝난다 — 그보다 길게
        proxy_read_timeout 60s;
    }
}
