# admin-service 내부 HTTP 로드밸런서 (compose.admin-service.yml 의 admin-service-lb) — 게이트웨이만 닿는다(roomless-service, internal).
# admin-service 인스턴스들을 Docker 내장 DNS(127.0.0.11)로 10초마다 다시 찾아 라운드로빈한다(--scale 변경에 재시작 불필요).
# 내부 헤더(x-internal-token · x-actor-* · x-client-ip)는 그대로 전달된다. upstream server 의 resolve 는 nginx 1.27.3 이상.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream admin_service {
    zone admin_service 64k;
    server admin-service:4002 resolve;
    keepalive 32;
}

server {
    listen 4002;

    location / {
        proxy_pass http://admin_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}
